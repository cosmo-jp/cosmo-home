services:
  cosmo-home:
    image: cosmo-home:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CONTACT_API_URL: ${VITE_CONTACT_API_URL:-/api/contact}
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/certs/localhost.pem:/etc/nginx/certs/localhost.pem:ro
      - ./nginx/certs/localhost-key.pem:/etc/nginx/certs/localhost-key.pem:ro
